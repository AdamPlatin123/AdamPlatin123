name: update-readme
on:
  schedule:
    - cron: '47 21 * * *'   # 每日 UTC 21:47（北京 05:47），与 resume 仓库错峰
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit README refresh
        run: |
          git config user.name "metrics-bot"
          git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: README metrics refresh $(date +%F)"
          git push
